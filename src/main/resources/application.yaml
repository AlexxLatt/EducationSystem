spring:
  application:
    name: EducationSystem

  datasource:
    url: jdbc:postgresql://postgres:5432/educationService
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

app:
  scheduler:
    delete-old-schedules:
      cron: "0 */5 * * * *"